# IntuneAppFastDeploy — this file is all you need.
# Ce fichier suffit, il n'y a rien d'autre à télécharger.
#
#   1. Fill in TENANT_ID and CLIENT_ID below (README, step 1).
#      Renseignez TENANT_ID et CLIENT_ID ci-dessous (README, étape 1).
#   2. docker compose up -d
#   3. Open / Ouvrez http://localhost:8080
#
#   Update / Mise à jour :   docker compose pull && docker compose up -d
#   Server with HTTPS / Serveur en HTTPS :   see the "https" service below.
#
# https://github.com/jclayssen/IntuneAppFastDeploy

services:
  app:
    image: ghcr.io/jclayssen/intuneappfastdeploy:latest
    restart: unless-stopped
    environment:
      # --- Required / Obligatoire -------------------------------------------
      TENANT_ID: ""   # Directory (tenant) ID      / ID de l'annuaire (locataire)
      CLIENT_ID: ""   # Application (client) ID    / ID d'application (client)

      # Address typed in the browser. The redirect URI registered in Entra ID
      # must be exactly <PUBLIC_URL>/auth/callback
      # Adresse saisie dans le navigateur ; l'URI de redirection déclarée dans
      # Entra ID doit être exactement <PUBLIC_URL>/auth/callback
      PUBLIC_URL: "http://localhost:8080"

      # --- Options ------------------------------------------------------------
      DEFAULT_LANGUAGE: "en"          # en, fr
      ENABLE_GROUP_PICKER: "false"    # true needs GroupMember.Read.All (README)
      # ALLOWED_USERS: "first@example.com,second@example.com"
      # MAX_DOWNLOAD_MB: "8192"
      # SESSION_HOURS: "12"
      # CLIENT_SECRET: ""             # only for a "Web" app registration
    # Owner of the ./config folder (Linux: the output of `id -u` and `id -g`).
    # Propriétaire du dossier ./config (Linux : résultat de `id -u` et `id -g`).
    user: "1000:1000"
    volumes:
      # Plain folder next to this file: pilot/production groups are saved in
      # ./config/rollout.json. Dossier simple à côté de ce fichier.
      - ./config:/config
    ports:
      # Reachable from this machine only. For colleagues, use the https
      # service below instead of opening this port.
      - "127.0.0.1:8080:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # HTTPS front door for a server. Not started by default:
  #   docker compose --profile https up -d
  # Then set PUBLIC_URL above to https://<SITE_ADDRESS>.
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      # Name colleagues type in their browser / Nom saisi par les collègues
      SITE_ADDRESS: "intune-deploy.example.com"
      # Certificate / Certificat :
      #   "internal"                          self-signed, generated automatically / autosigné
      #   "/certs/cert.pem /certs/key.pem"    your own, files in ./certs / le vôtre, dans ./certs
      #   "you@example.com"                   Let's Encrypt (public DNS name, ports 80/443 open)
      TLS: "internal"
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./certs:/certs:ro
      # Certificates obtained or generated by Caddy are kept here.
      - ./config/caddy:/data

configs:
  caddyfile:
    # "$$" is how this file writes a literal "$": Caddy reads SITE_ADDRESS and
    # TLS from the environment of the https service above.
    content: |
      {$$SITE_ADDRESS} {
      	tls {$$TLS}
      	encode zstd gzip
      	header Strict-Transport-Security "max-age=31536000"
      	reverse_proxy app:8080
      }
