# IntuneAppFastDeploy
#
#   Local use (your own PC):      docker compose up -d
#                                 then open http://localhost:8080
#
#   On a server, with HTTPS:      docker compose --profile https up -d
#                                 (set SITE_ADDRESS and TLS in .env first)
#
#   Update to the latest image:   docker compose pull && docker compose up -d

services:
  app:
    image: ${IMAGE:-ghcr.io/jclayssen/intuneappfastdeploy:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    # Run as the owner of the ./config folder (see PUID/PGID in .env).
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # Plain folder next to this file: pilot/production groups live in
      # ./config/rollout.json. Back it up like any other file.
      - ./config:/config
    ports:
      # Reachable from this machine only. The https profile below is what
      # opens the tool to colleagues.
      - "127.0.0.1:${PORT:-8080}:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # HTTPS front door, only started with:  docker compose --profile https up -d
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS: ${TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      # Certificates obtained or generated by Caddy are kept here.
      - ./config/caddy:/data
