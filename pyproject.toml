[project]
name = "intune-app-fast-deploy"
version = "0.1.0"
description = "Publish and update MSI/EXE applications in Microsoft Intune from a download link (test version)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Version ranges only: the exact tested versions live in uv.lock, which is
# regenerated automatically (Renovate). Nothing here needs manual edits.
dependencies = [
    "cryptography>=44",
    "fastapi>=0.115",
    "httpx>=0.28",
    "msal>=1.31",
    "olefile>=0.47",
    "pefile>=2024.8.26",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iafd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["samples: needs real installer samples (downloaded on demand)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
