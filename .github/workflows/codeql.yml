name: CodeQL

# Free code scanning for public repositories: looks for security mistakes in
# the tool's own code (Renovate only covers the dependencies).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
